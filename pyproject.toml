[project]
name = "runge-kutta-integrator"
version = "0.1.0"
description = "Fourth-order fixed-step ODE integrator operating on plain Python callables for systems of equations."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
